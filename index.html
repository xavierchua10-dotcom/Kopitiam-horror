<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Last Order</title>
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="c"></canvas>
<div id="fx"></div><div id="cbt"></div><div id="cbb"></div><div id="lidT" class="lid"></div><div id="lidB" class="lid"></div>
<div id="top"><span class="clock" id="clk">3:07 AM</span><span id="obj"></span></div>
<div id="sub"></div>
<div id="hint">Tap the floor to walk · drag to look</div>
<div id="stick"><div id="knob"></div></div>

<div id="fade"></div>
<div id="dcard"></div>
<div class="card" id="title"><h1>LAST ORDER</h1><p>A kopitiam. Five days.<br>Headphones recommended.<br>Best in landscape, two thumbs.</p><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><div id="gq"><span>Graphics</span><button data-r="1">Sharp</button><button data-r=".7">Normal</button><button data-r=".5">Light</button></div><div id="cq"><button data-s="1">Smooth city</button><button data-s="0">Basic</button></div></div><button id="begin">Tap to begin</button></div>
<div class="card" id="end"><h1 id="endh">HOME</h1><p id="endp">The shutter is open. Someone finally got their order.</p><p id="endl" style="font-size:13px;color:#8f88ad">Last Order · first night</p><button id="again">Play again</button></div>
<script type="module" src="game.js"></script>
</body></html>
